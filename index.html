<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایمر کنکور</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, Tahoma;
            background-color: #fff;
            direction: rtl;
        }

        #countdown {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .time-box {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            min-width: 80px;
        }

        .time-value {
            font-size: 30px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 5px;
        }

        .time-label {
            color: #666;
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin: 0 0 20px 0;
        }

        .message {
            color: #e74c3c;
            font-size: 18px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="countdown">
        <h1>⏳ تا کنکور ۱۴۰۳</h1>
        <div class="timer">
            <div class="time-box">
                <div class="time-value" id="days">--</div>
                <div class="time-label">روز</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="hours">--</div>
                <div class="time-label">ساعت</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="minutes">--</div>
                <div class="time-label">دقیقه</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="seconds">--</div>
                <div class="time-label">ثانیه</div>
            </div>
        </div>
        <div class="message">پنجشنبه ۶ تیر ۱۴۰۳ - ساعت ۱۰ صبح</div>
    </div>

    <script>
        const targetDate = new Date('2024-06-27T10:00:00');

        function updateCountdown() {
            const now = new Date();
            const timeLeft = targetDate - now;

            if (timeLeft <= 0) {
                document.getElementById('countdown').innerHTML = '<h1>🎯 وقت کنکوره!</h1><div class="message">موفق باشی! 💪</div>';
                return;
            }

            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;
        }

        // Update immediately and then every second
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
