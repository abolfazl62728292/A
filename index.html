<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="شمارشگر معکوس تا کنکور سراسری ۱۴۰۴">
    <meta name="keywords" content="کنکور, شمارش معکوس, کنکور ۱۴۰۴">
    <title>شمارش معکوس کنکور ۱۴۰۴</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazir', Tahoma, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6c5ce7, #a363d9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 2rem;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            animation: fadeInDown 1s ease;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: nowrap;
        }

        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInUp 1s ease;
        }

        .number {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            min-width: 120px;
            padding: 1.5rem 1rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1),
                       inset 0 0 15px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            transition: all 0.4s ease;
            animation: pulse 2s infinite;
        }

        .number:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2),
                       inset 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .label {
            margin-top: 0.8rem;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            opacity: 0.9;
        }

        .message {
            color: #ffffff;
            font-weight: bold;
            margin-top: 2rem;
            font-size: 1.2rem;
            padding: 1rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease;
        }

        .date-info {
            color: #ffffff;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            opacity: 0.8;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
            100% {
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .timer {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .number {
                min-width: 90px;
                font-size: 2rem;
                padding: 1rem 0.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .container {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .number {
                min-width: 70px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏳ تا کنکور ۱۴۰۴</h1>
        <div class="timer">
            <div class="time-block">
                <div class="number" id="days">000</div>
                <div class="label">روز</div>
            </div>
            <div class="time-block">
                <div class="number" id="hours">00</div>
                <div class="label">ساعت</div>
            </div>
            <div class="time-block">
                <div class="number" id="minutes">00</div>
                <div class="label">دقیقه</div>
            </div>
            <div class="time-block">
                <div class="number" id="seconds">00</div>
                <div class="label">ثانیه</div>
            </div>
        </div>
        <div class="message" id="message">در حال بارگذاری...</div>
        <div class="date-info" id="dateInfo"></div>
    </div>

    <script>
    (function() {
        // تنظیم تاریخ کنکور ۱۴۰۴
        const examDate = new Date("2026-06-29T08:00:00");

        // آرایه پیام‌های انگیزشی
        const messages = [
            "💪 با تلاش و پشتکار به موفقیت می‌رسی!",
            "📚 هر روز یک قدم به هدفت نزدیک‌تر می‌شوی",
            "🌟 باور داشته باش که می‌تونی!",
            "🎯 تمرکز کن، موفقیت نزدیکه!",
            "⭐️ آینده‌ت رو خودت می‌سازی!",
            "📖 با هر ساعت مطالعه، به رویات نزدیک‌تر میشی"
        ];

        // نمایش اطلاعات تاریخ به زبان فارسی
        const dateInfoEl = document.getElementById('dateInfo');
        dateInfoEl.textContent = examDate.toLocaleDateString('fa-IR', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        }) + ' - ساعت ' + examDate.toLocaleTimeString('fa-IR', {
            hour: '2-digit',
            minute: '2-digit'
        });

        // گرفتن المان‌ها
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const messageEl = document.getElementById('message');

        function updateTimer() {
            const now = new Date();
            const diff = examDate - now;

            if (diff <= 0) {
                document.querySelector('.container').innerHTML =
                    '<h1 style="color: #ffffff; font-size: 1.8rem;">🎯 وقت کنکوره! موفق باشی! 💪</h1>';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            daysEl.textContent = String(days).padStart(3, '0');
            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');

            // نمایش پیام انگیزشی تصادفی
            if (!messageEl.getAttribute('data-initialized')) {
                messageEl.textContent = messages[Math.floor(Math.random() * messages.length)];
                messageEl.setAttribute('data-initialized', 'true');
            }

            // تغییر پیام هر 30 ثانیه
            if (seconds === 0 && minutes % 1 === 0) {
                messageEl.textContent = messages[Math.floor(Math.random() * messages.length)];
            }
        }

        // اجرای تایمر
        updateTimer();
        setInterval(updateTimer, 1000);

        // به‌روزرسانی در صورت بازگشت به تب
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) updateTimer();
        });
    })();
    </script>
</body>
</html>
