<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شمارش معکوس کنکور ۱۴۰۳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, Tahoma, Arial;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .timer-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .time-unit {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            min-width: 90px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 5px;
        }

        .label {
            color: #666;
            font-size: 14px;
        }

        .title {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .message {
            color: #e74c3c;
            font-size: 18px;
            margin-top: 20px;
            font-weight: bold;
        }

        .date-info {
            color: #666;
            font-size: 14px;
            margin-top: 15px;
        }

        @media (max-width: 480px) {
            .time-unit {
                min-width: 70px;
            }
            .number {
                font-size: 24px;
            }
            .title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">⏳ تا کنکور ۱۴۰۳</div>
        
        <div class="timer-display">
            <div class="time-unit">
                <div class="number" id="days">00</div>
                <div class="label">روز</div>
            </div>
            <div class="time-unit">
                <div class="number" id="hours">00</div>
                <div class="label">ساعت</div>
            </div>
            <div class="time-unit">
                <div class="number" id="minutes">00</div>
                <div class="label">دقیقه</div>
            </div>
            <div class="time-unit">
                <div class="number" id="seconds">00</div>
                <div class="label">ثانیه</div>
            </div>
        </div>

        <div class="message" id="message"></div>
        <div class="date-info">پنجشنبه ۶ تیر ۱۴۰۳ - ساعت ۱۰:۰۰ صبح</div>
    </div>

    <script>
        function updateCountdown() {
            // تاریخ کنکور: ۶ تیر ۱۴۰۳ ساعت ۱۰ صبح
            const konkoorDate = new Date('2024-06-27T10:00:00');
            const now = new Date();
            
            const diff = konkoorDate - now;

            if (diff <= 0) {
                document.querySelector('.container').innerHTML = `
                    <div class="title">🎯 وقت کنکوره!</div>
                    <div class="message">موفق باشی! 💪</div>
                `;
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            // پیام انگیزشی
            const message = document.getElementById('message');
            if (days > 30) {
                message.textContent = "با برنامه‌ریزی دقیق به هدفت میرسی! 💪";
            } else if (days > 7) {
                message.textContent = "تمرکز کن، موفقیت نزدیکه! 🎯";
            } else {
                message.textContent = "آماده‌ای؟ موفقیت در انتظارته! ⚡";
            }
        }

        // اجرای تابع هر ثانیه
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
